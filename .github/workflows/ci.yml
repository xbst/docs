name: ci
on:
  push:
    branches:
      - master
      - main
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: zensical-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            zensical-
      # 0.0.67 added the social plugin (social cards)
      - run: pip install "zensical>=0.0.67"
      - run: pip install "git+https://github.com/xbst/PinConnect.git@master"
      - run: pip install "git+https://github.com/xbst/md-iframe.git@master"
      - name: Generate interactive pinouts
        run: |
          shopt -s nullglob
          for toml in docs/pinouts/*/*.toml; do
            echo "pinconnect $toml"
            pinconnect "$toml" -i
          done      
      - run: pip install "git+https://github.com/xbst/3DStep.git@master"
      - name: Generate 3D assembly instructions
        run: |
          shopt -s nullglob
          for toml in docs/3d/*/*.toml; do
            echo "3dstep $toml"
            3dstep "$toml"
          done
      - run: zensical build --clean 
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment